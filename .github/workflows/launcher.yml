# Launcher CI (VK-1677): unit tests, the jpackage app image, and the packaged --self-test.
#
# Runs on EVERY pull request, so that the "launcher-ci" gate always reports and can be a required check:
# a workflow skipped by a `paths:` filter would leave a required check pending forever. The `changes` job
# decides whether the launcher (or the script library its build packs) changed; when it did not, `build`
# is skipped and the gate passes in seconds.
name: Launcher

on:
  pull_request:
  push:
    branches: [dev]
    paths:
      - 'launcher/**'
      - 'assets/scripts/lib/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect launcher changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      launcher: ${{ steps.diff.outputs.launcher }}
    steps:
      - name: Check out the merge commit and its base (trees only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github

      - name: Decide whether the launcher must be built
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "launcher=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the pull request's merge commit and HEAD^1 the tip of the base branch, so this is exactly
          # what merging would change. --no-renames keeps git from fetching blobs for rename detection.
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          if grep -qE '^(launcher/|assets/scripts/lib/|\.github/workflows/launcher\.yml$)' <<< "$changed"; then
            echo "launcher=true" >> "$GITHUB_OUTPUT"
          else
            echo "launcher=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, test, package and self-test
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: launcher
    steps:
      - name: Check out the launcher and the script library it packs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            launcher
            assets/scripts/lib

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run the unit tests
        run: ./mvnw.cmd -B -ntp verify

      - name: Package the app image
        run: ./mvnw.cmd -B -ntp jpackage:jpackage

      - name: The app image holds only the launcher jar
        run: |
          $names = @((Get-ChildItem 'target/dist/VertexForge Launcher/app' -Force).Name | Sort-Object)
          $names
          $expected = @('.jpackage.xml', 'VertexForge Launcher.cfg', 'VertexForgeLauncher.jar') | Sort-Object
          if (Compare-Object $names $expected) {
            Write-Error 'app/ must hold only the shaded jar and the jpackage files'
            exit 1
          }

      - name: Self-test the packaged launcher
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path 'target/dist/VertexForge Launcher/VertexForge Launcher.exe').Path
          $report = Join-Path $env:RUNNER_TEMP 'self-test-ok.txt'
          # Started from an unrelated folder: the launcher must find itself through jpackage.app-path (VK-1681).
          $run = @{
            FilePath               = $exe
            ArgumentList           = @('--self-test', '--self-test-packaged', "--self-test-report=`"$report`"")
            WorkingDirectory       = $env:RUNNER_TEMP
            Wait                   = $true
            PassThru               = $true
            RedirectStandardOutput = Join-Path $env:RUNNER_TEMP 'self-test-ok.out'
            RedirectStandardError  = Join-Path $env:RUNNER_TEMP 'self-test-ok.err'
          }
          $p = Start-Process @run
          Get-Content $run.RedirectStandardError -ErrorAction SilentlyContinue
          if (-not (Test-Path $report)) {
            Write-Error "no self-test report (exit code $($p.ExitCode))"
            exit 1
          }
          Get-Content $report
          if ($p.ExitCode -ne 0) {
            Write-Error "the self-test exited with $($p.ExitCode)"
            exit 1
          }
          if (-not (Select-String -Path $report -SimpleMatch 'SELF-TEST PASS' -Quiet)) {
            Write-Error 'the self-test report does not say PASS'
            exit 1
          }

      - name: The self-test fails on a broken main.fxml
        timeout-minutes: 3
        run: |
          # A copy of the image whose main.fxml names an onAction handler the controller does not have.
          $broken = Join-Path $env:RUNNER_TEMP 'broken-image'
          Copy-Item 'target/dist/VertexForge Launcher' $broken -Recurse
          Get-ChildItem $broken -Recurse -File | Where-Object IsReadOnly | ForEach-Object { $_.IsReadOnly = $false }
          $appJar = Join-Path $broken 'app/VertexForgeLauncher.jar'
          $work = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'broken-fxml')
          Push-Location $work
          jar xf $appJar fxml/main.fxml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $fxml = Join-Path $work 'fxml/main.fxml'
          $text = [IO.File]::ReadAllText($fxml)
          if (-not $text.Contains('#onCreateProject"')) {
            Write-Error 'main.fxml no longer has the #onCreateProject handler this test breaks'
            exit 1
          }
          [IO.File]::WriteAllText($fxml, $text.Replace('#onCreateProject"', '#onCreateProjectMissing"'))
          jar uf $appJar fxml/main.fxml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location

          $report = Join-Path $env:RUNNER_TEMP 'self-test-broken.txt'
          $p = Start-Process -FilePath (Join-Path $broken 'VertexForge Launcher.exe') `
            -ArgumentList @('--self-test', "--self-test-report=`"$report`"") -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -eq 0) {
            Write-Error 'the self-test passed with a broken main.fxml'
            exit 1
          }
          if (-not (Select-String -Path $report -SimpleMatch 'onAction' -Quiet)) {
            Write-Error 'the self-test report does not name the broken handler'
            exit 1
          }

      - name: Upload the test and self-test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-reports
          path: |
            launcher/target/surefire-reports/
            ${{ runner.temp }}/self-test-*
          if-no-files-found: ignore

  launcher-ci:
    name: launcher-ci
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a green launcher build whenever the launcher changed
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          LAUNCHER: ${{ needs.changes.outputs.launcher }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES launcher=$LAUNCHER build=$BUILD"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$BUILD" = "success" ]; then exit 0; fi
          if [ "$BUILD" = "skipped" ] && [ "$LAUNCHER" != "true" ]; then exit 0; fi
          exit 1
